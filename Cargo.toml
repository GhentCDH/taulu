[package]
name = "taulu"
version = "3.0.1"
edition = "2024"

[lib]
name = "_core"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib"]

[features]
default = []
debug-tools = ["dep:rerun"]

[lints.clippy]
correctness = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"
unnecessary_debug_formatting = "allow"
needless_pass_by_value = "allow"


[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
# "extension-module" tells pyo3 we want to build an extension module (skips linking against libpython.so)
# "abi3-py39" tells pyo3 (and maturin) to build using the stable ABI with minimum Python version 3.9
# used to be version = "0.22.4"
pyo3 = { version = "0.28.3", features = [
  "extension-module",
  "abi3-py39",
  "generate-import-lib",
] }
pathfinding = "4.14.0"
numpy = "0.28.0"
rayon = "1.11.0"
approx = "0.5.1"
ndarray = { version = "0.17.1", default-features = false }
rerun = { version = "0.32.1", optional = true, default-features = false, features = [
  "sdk",
] }
rand = "0.10.1"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "edge_selection"
harness = false
